function sampleDeck(){
  const S1 = gid("s"), S2 = gid("s"), S3 = gid("s"), S4 = gid("s");
  const C = (sec, type, bloom, front, back, points, mcAnswer, wrong) => mkCard({type, bloom, front, back, points: points || [], mcAnswer: mcAnswer || back, wrong}, sec);
  return {kind:"deck", id: gid("d"), sample:true, name:"Sample · Autonomic pharmacology", created: Date.now(), added: Date.now(), courseId:null, srcKind:"text", pageCount:0,
    focus:"Example: Prof said β-blocker selectivity and organophosphate poisoning are definitely examined. Skip the history slides.",
    sections:[
      {id:S1, title:"Cholinergic drugs", pages:null, priority:"high", why:"Organophosphate poisoning is flagged in the exam focus", learned:false, checks:{}, feyn:0, lesson:{
        keyPoints:["Acetylcholine acts on muscarinic (M1–M3, G-protein) and nicotinic (ion channel) receptors.","Atropine is a competitive muscarinic antagonist: ↑ heart rate, dry mouth, dilated pupils, urinary retention.","M2 receptors on the SA node mediate vagal slowing of the heart.","★ Organophosphates irreversibly inhibit acetylcholinesterase, so ACh builds up at muscarinic and nicotinic synapses.","★ Treat organophosphate poisoning with IV atropine (muscarinic effects) plus pralidoxime (reactivates the enzyme if given early)."],
        explain:"Acetylcholine is the parasympathetic messenger. On the heart it binds M2 receptors at the SA node and slows the rate. On glands and smooth muscle it binds M3 receptors and drives secretions and constriction. Blocking these receptors with atropine therefore removes the 'rest and digest' brake: the heart speeds up, secretions dry, and pupils dilate. The opposite problem happens with organophosphates. They disable acetylcholinesterase, the enzyme that clears ACh, so ACh floods every cholinergic synapse. Muscarinic overload gives the classic picture of salivation, sweating, bronchorrhoea, miosis and bradycardia. Nicotinic overload at muscle causes twitching, then weakness. Atropine blocks the muscarinic flood but does nothing at nicotinic sites, which is why pralidoxime is added.",
        hook:"Organophosphate muscarinic signs are DUMBBELS: Diarrhoea, Urination, Miosis, Bradycardia, Bronchorrhoea, Emesis, Lacrimation, Salivation.",
        checks:[{q:"Why does atropine not fix muscle weakness in organophosphate poisoning?", a:"Weakness is a nicotinic effect at the neuromuscular junction, and atropine only blocks muscarinic receptors."},{q:"Which receptor does the vagus nerve act on to slow the heart?", a:"M2 muscarinic receptors on the SA node."}]}},
      {id:S2, title:"Adrenergic agonists", pages:null, priority:"high", why:"Anaphylaxis and shock management are classic exam material", learned:false, checks:{}, feyn:0, lesson:{
        keyPoints:["Postganglionic sympathetic neurons release noradrenaline, except at sweat glands (ACh).","α1 → vasoconstriction; β1 → ↑ heart rate and contractility; β2 → bronchodilation and vasodilation in skeletal muscle.","Adrenaline acts on α and β receptors. It is first-line for anaphylaxis: 0.5 mg IM (1 mg/mL) in adults.","Noradrenaline is mainly α1 (some β1). It is the first-line vasopressor in septic shock.","Salbutamol is a short-acting β2 agonist used to relieve bronchospasm."],
        explain:"Each adrenergic receptor does one main job. α1 squeezes blood vessels. β1 makes the heart beat faster and harder. β2 relaxes airway smooth muscle. Choosing a drug means choosing which jobs you want done. In anaphylaxis, vessels are leaking and dilating and the airways are closing, so you need all three. Adrenaline gives α1 to restore blood pressure, β2 to open the airways, and it also stabilises mast cells. In septic shock the main problem is vasodilation. Noradrenaline gives strong α1 tightening with less heart-rate push, which suits that. Salbutamol is selective for β2, so it opens the airways with fewer cardiac effects. At high doses it still causes tachycardia and tremor.",
        hook:"You have 1 heart (β1) and 2 lungs (β2).",
        checks:[{q:"Why is adrenaline better than noradrenaline in anaphylaxis?", a:"Adrenaline adds β2 bronchodilation and mast-cell stabilisation on top of α1 vasoconstriction."},{q:"Which receptor does salbutamol target?", a:"β2 adrenoceptors on bronchial smooth muscle."}]}},
      {id:S3, title:"β-blockers", pages:null, priority:"high", why:"Selectivity is flagged in the exam focus", learned:false, checks:{}, feyn:0, lesson:{
        keyPoints:["★ Propranolol is non-selective (β1 + β2). Atenolol and bisoprolol are β1-selective (cardioselective).","β1 blockade ↓ heart rate, contractility and renin release, which lowers blood pressure.","★ Blocking β2 in the airways can trigger bronchospasm, so non-selective β-blockers are contraindicated in asthma.","Selectivity is dose-dependent. Use cardioselective agents cautiously in asthma or COPD.","β-blockers can mask the warning signs of hypoglycaemia (tremor, palpitations)."],
        explain:"β-blockers sit on β receptors and stop adrenaline and noradrenaline from acting. Blocking β1 in the heart slows it and weakens each beat. In the kidney, β1 blockade cuts renin release. Both effects lower blood pressure and the heart's oxygen demand. The trouble comes from β2. In the lungs, β2 is what keeps the airways open under stress. A non-selective drug like propranolol blocks that too, and an asthmatic can bronchospasm. Cardioselective drugs mostly spare β2, but only mostly: at higher doses they lose selectivity. Because the early warning signs of hypoglycaemia (shaking and a racing heart) are adrenergic, β-blockers can hide them from diabetics.",
        hook:"Atenolol, Bisoprolol, Metoprolol (A, B, M) are β1 Mostly; Propranolol is Promiscuous.",
        checks:[{q:"Why can β-blockers lower blood pressure even without changing heart rate much?", a:"β1 blockade in the kidney reduces renin release, lowering angiotensin II and aldosterone."},{q:"Name one cardioselective β-blocker.", a:"Atenolol, bisoprolol or metoprolol."}]}},
      {id:S4, title:"History of autonomic research", pages:null, priority:"skip", why:"Exam focus says skip the history slides", learned:false, checks:{}, feyn:0, lesson:null},
    ],
    cards:[
      C(S1,"basic",1,"Which receptors does atropine block?","Muscarinic ACh receptors (competitive antagonist).",null,"Muscarinic acetylcholine receptors",["Nicotinic acetylcholine receptors","β1 adrenoceptors","α1 adrenoceptors"]),
      C(S1,"basic",1,"Antidotes for organophosphate poisoning?","IV atropine plus pralidoxime.",null,"IV atropine plus pralidoxime",["IV neostigmine plus atropine","IM adrenaline plus hydrocortisone","Naloxone plus flumazenil"]),
      C(S1,"cloze",1,"Organophosphates irreversibly inhibit ____.","acetylcholinesterase",null,"acetylcholinesterase",["choline acetyltransferase","monoamine oxidase","nicotinic receptors"]),
      C(S1,"why",2,"Why does atropine cause tachycardia?","It blocks M2 receptors on the SA node, removing vagal slowing, so sympathetic drive is unopposed and heart rate rises.",["M2 receptors on the SA node","Removes vagal / parasympathetic tone","Unopposed sympathetic drive → ↑ HR"],"It blocks SA-node M2 receptors, removing vagal slowing",["It stimulates β1 receptors on the SA node","It blocks nicotinic receptors at the AV node","It releases noradrenaline from sympathetic nerves"]),
      C(S1,"case",3,"A farmer has pinpoint pupils, drooling, bradycardia and wheeze after spraying crops. What is the mechanism, and what do you give first?","Organophosphate inhibition of acetylcholinesterase causes ACh excess at muscarinic and nicotinic sites. Give IV atropine titrated to dry secretions, plus pralidoxime.",["AChE inhibition → ACh build-up","Muscarinic signs explained","IV atropine first, titrated to secretions","Pralidoxime for nicotinic effects / enzyme"],"AChE inhibition → ACh excess; give IV atropine first",["Muscarinic agonist overdose; give neostigmine first","Opioid toxicity; give naloxone first","β-blocker overdose; give glucagon first"]),
      C(S2,"basic",1,"First-line drug and dose for adult anaphylaxis?","Adrenaline 0.5 mg IM (1 mg/mL).",null,"Adrenaline 0.5 mg IM (1 mg/mL)",["Adrenaline 1 mg IV (1 mg/mL) bolus","Chlorphenamine 10 mg IV","Hydrocortisone 200 mg IM"]),
      C(S2,"cloze",1,"Salbutamol is a short-acting ____ agonist.","β2",null,"β2",["β1","α1","M3"]),
      C(S2,"basic",1,"Main transmitter of postganglionic sympathetic neurons?","Noradrenaline (sweat glands use ACh).",null,"Noradrenaline (except sweat glands: ACh)",["Acetylcholine at all targets","Adrenaline","Dopamine"]),
      C(S2,"compare",4,"Adrenaline vs noradrenaline: which suits septic shock and which suits anaphylaxis? Justify.","Noradrenaline for septic shock: mainly α1 vasoconstriction raises MAP with less tachycardia. Adrenaline for anaphylaxis: α1 vasoconstriction plus β2 bronchodilation and mast-cell stabilisation.",["NA mainly α1 → raises MAP","Septic shock is mainly vasodilation","Adrenaline adds β2 bronchodilation","Mast-cell stabilisation in anaphylaxis"],"NA for septic shock (α1); adrenaline for anaphylaxis (α1 + β2)",["Adrenaline for septic shock; NA for anaphylaxis","NA for both, as it is more β2-selective","Adrenaline for both, as NA has no α1 effect"]),
      C(S3,"cloze",1,"Propranolol is a ____ β-blocker.","non-selective (β1 + β2)",null,"non-selective (β1 + β2)",["β1-selective","β2-selective","α1-selective"]),
      C(S3,"basic",1,"Name two cardioselective β-blockers.","Atenolol, bisoprolol (also metoprolol).",null,"Atenolol and bisoprolol",["Propranolol and timolol","Labetalol and carvedilol","Salbutamol and terbutaline"]),
      C(S3,"why",2,"Why can non-selective β-blockers trigger bronchospasm in asthma?","They block β2 receptors on bronchial smooth muscle, removing adrenergic bronchodilation, so constriction dominates.",["β2 receptors on bronchial smooth muscle","β2 normally causes bronchodilation","Blockade → unopposed bronchoconstriction"],"They block bronchial β2, removing adrenergic bronchodilation",["They stimulate bronchial M3 receptors directly","They block β1 receptors on airway smooth muscle","They release histamine from mast cells"]),
      C(S3,"case",3,"A 58-year-old with COPD starts propranolol for tremor and becomes wheezy a week later. What's happening, and what would you change?","Non-selective β2 blockade is causing bronchoconstriction. Stop propranolol. For tremor consider an alternative such as primidone; if a β-blocker is needed for the heart, use a cardioselective one cautiously.",["Propranolol blocks β2 in airways","Stop / switch the drug","Cardioselective agent if a β-blocker is needed"],"β2 blockade → bronchoconstriction; stop propranolol and switch",["β1 blockade → pulmonary oedema; add furosemide","COPD exacerbation unrelated to the drug; add steroids","Anaphylaxis to propranolol; give IM adrenaline"]),
      C(S3,"compare",4,"A hypertensive patient also has asthma. Atenolol or propranolol? Justify.","Atenolol. It is β1-selective, so it is less likely to block bronchial β2 receptors. Propranolol is non-selective and contraindicated in asthma. Selectivity falls at high doses, so use it cautiously.",["Atenolol is β1-selective","Propranolol blocks β2 → bronchospasm","Selectivity is dose-dependent"],"Atenolol, because it is β1-selective",["Propranolol, because it is β1-selective","Propranolol, because β2 blockade relaxes airways","Either; selectivity makes no difference in asthma"]),
    ]};
