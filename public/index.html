<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/runtime.js"></script>
<title>Recall Lab</title>
<style>
/* Layout: one calm 1080px column in Anthropic's warm neutrals. A single clay accent marks the next action; everything else stays neutral to keep eye strain low. */
:root{
  --bg:#F5F4EE; --surface:#FBFAF6; --surface-2:#EDEBE3; --ink:#2B2A26; --ink-strong:#141413; --muted:#6E6C64; --line:#E2DFD5;
  --accent:#C2603E; --accent-ink:#FFFFFF; --accent-soft:#F3E5DC;
  --good:#5D7A4C; --warn:#9A7230; --bad:#B0533C;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#2F2F2C; --surface-2:#393935; --ink:#E8E6DE; --ink-strong:#F5F4EE; --muted:#A3A097; --line:#44433E;
  --accent:#D3795A; --accent-ink:#1E1D1B; --accent-soft:#45342C;
  --good:#93B07F; --warn:#D2AA62; --bad:#DD8A73; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#2F2F2C; --surface-2:#393935; --ink:#E8E6DE; --ink-strong:#F5F4EE; --muted:#A3A097; --line:#44433E;
  --accent:#D3795A; --accent-ink:#1E1D1B; --accent-soft:#45342C;
  --good:#93B07F; --warn:#D2AA62; --bad:#DD8A73; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);color:var(--ink-strong);line-height:1.2;margin:0;text-wrap:balance;font-weight:500}
h1{font-size:clamp(1.65rem,3.6vw,2.15rem)}
h2{font-size:1.3rem}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:600;font-size:1.2rem;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink-strong)}
.brand .mark{width:10px;height:10px;border-radius:50%;background:var(--accent)}
nav.main{display:flex;gap:2px;flex-wrap:wrap}
nav.main button{background:none;border:0;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
nav.main button:hover{color:var(--ink)}
nav.main button[aria-current="page"]{background:var(--surface-2);color:var(--ink-strong)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.sync{font-size:.78rem;color:var(--muted)}
.sync.err{color:var(--bad)}
main{padding-block:28px 90px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel.flat{background:transparent}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:600;line-height:1.25;text-align:center;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:.86rem}
.btn.lg{padding:12px 20px;font-size:1.04rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:1px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.accent{color:var(--accent);background:var(--accent-soft)}
.chip.good{color:var(--good)}
.chip.warn{color:var(--warn)}
.chip.bad{color:var(--bad)}
.chip.skip{text-decoration:line-through}
textarea,input[type=text],input[type=search],input[type=date],input[type=time],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
textarea{min-height:110px;resize:vertical;line-height:1.55}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
label.f span.hint{font-weight:400;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring::before{content:"";grid-area:1/1;width:46px;height:46px;border-radius:50%;background:var(--surface)}
.ring b{grid-area:1/1;font-family:var(--mono);font-size:.8rem;z-index:1;font-weight:600}
.ring.big{width:88px;height:88px}
.ring.big::before{width:70px;height:70px}
.ring.big b{font-size:1.05rem}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.bignum{font-family:var(--display);font-size:3.4rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip i{aspect-ratio:1;border-radius:3px;background:var(--surface-2);max-width:100%}
.strip i[data-v="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.strip i[data-v="2"]{background:color-mix(in srgb,var(--accent) 60%,var(--surface-2))}
.strip i[data-v="3"]{background:var(--accent)}
.lect{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
@media (max-width:600px){.lect{grid-template-columns:auto minmax(0,1fr)}.lect .go{grid-column:1/-1;align-items:flex-start!important}.lect .go span{text-align:left!important}}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.steps4 div{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);min-width:0}
.steps4 .bar{height:4px}
.next{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.next .eyebrow{color:var(--accent)}
.sec{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.sec:first-child{border-top:0}
.sec .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);margin-top:3px;display:grid;place-items:center;font-size:.68rem;font-weight:700;color:var(--accent-ink)}
.sec .dot.learned{background:color-mix(in srgb,var(--accent) 55%,var(--surface));border-color:transparent}
.sec .dot.secure{background:var(--accent);border-color:var(--accent)}
.sec.skipped{opacity:.55}
.sec .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.sec{grid-template-columns:26px minmax(0,1fr)}.sec .acts{grid-column:2;justify-content:flex-start}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 11px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink-strong)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink-strong);border-bottom-color:var(--accent)}
.card{max-width:740px;margin:0 auto;width:100%}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:18px;min-height:280px}
.flash .q{font-family:var(--display);font-size:1.3rem;line-height:1.45;color:var(--ink-strong);white-space:pre-wrap}
.flash .a{font-size:1.06rem;white-space:pre-wrap;padding-top:16px;border-top:1px dashed var(--line)}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.grades button:hover{background:var(--surface-2)}
.grades button small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:.74rem}
.grades button.sugg{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.conf{display:flex;gap:8px;flex-wrap:wrap}
.conf button[aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink);color:var(--ink-strong)}
.prog{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.fb{border-radius:10px;padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.fb ul{margin:0;padding-left:20px}
.fb h4{margin:0;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kp{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.kp li.star::marker{content:"★  ";color:var(--accent)}
.prose{max-width:68ch;white-space:pre-wrap}
.hook{border-left:2px solid var(--accent);padding:2px 0 2px 14px;font-style:italic}
.check{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:12px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;align-items:flex-start}
.opt:hover:not([disabled]){background:var(--surface-2)}
.opt[disabled]{cursor:default}
.opt .k{font-family:var(--mono);color:var(--muted);flex:none}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;cursor:pointer}
.drop.has{border-color:var(--accent);background:var(--accent-soft)}
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.loop div{padding:14px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.loop b{font-family:var(--display);font-weight:600;color:var(--ink-strong)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:2px}
.side button.item{display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);min-width:0}
.side button.item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side button.item:hover{background:var(--surface-2)}
.side button.item[aria-current="true"]{background:var(--surface-2);color:var(--ink-strong);font-weight:600}
.side .tsearch{margin:4px 0 6px;font-size:.88rem;padding:7px 10px}
.side .tseg{display:flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:2px;margin-bottom:4px}
.side .tseg button{flex:1;border:0;background:none;padding:5px 6px;border-radius:6px;font-size:.8rem;color:var(--muted);cursor:pointer}
.side .tseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink-strong);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tlist{display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 230px);overflow-y:auto;margin-right:-6px;padding-right:6px}
@media (max-width:760px){.tlist{max-height:40vh}}
.trow{position:relative;display:flex;align-items:center;border-radius:8px}
.trow:hover,.trow.on{background:var(--surface-2)}
.trow > button.topen{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left;background:none;border:0;padding:7px 4px 7px 10px;cursor:pointer;color:var(--ink)}
.trow.on > button.topen{color:var(--ink-strong);font-weight:600}
.trow .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.trow .ts{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.74rem;color:var(--muted);font-weight:400}
.trow .tdots{flex:none;border:0;background:none;width:28px;height:28px;margin-right:4px;border-radius:6px;cursor:pointer;color:var(--muted);opacity:0;font-size:1rem;line-height:1}
.trow:hover .tdots,.trow.on .tdots,.trow .tdots[aria-expanded="true"]{opacity:1}
.trow .tdots:hover{background:var(--line)}
@media (hover:none){.trow .tdots{opacity:1}}
.trow{flex-wrap:wrap}
.tmenu{flex-basis:100%;display:flex;gap:4px;padding:0 8px 8px}
.tmenu button{flex:1;border:1px solid var(--line);background:var(--surface);text-align:center;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font-size:.85rem}
.tmenu button:hover{background:var(--bg)}
.tmenu button.danger{color:var(--bad)}
.tconfirm{padding:8px 10px;border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.trename{width:100%;font-size:.88rem;padding:6px 8px}
.side .lbl{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.lrow:first-child{border-top:0}
@media (max-width:600px){.lrow{grid-template-columns:auto minmax(0,1fr)}.lrow .acts{grid-column:1/-1}}
.hit{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.hit mark{background:var(--accent-soft);color:var(--ink-strong);border-radius:3px;padding:0 2px}
.chat{display:flex;flex-direction:column;gap:14px;min-height:240px;max-height:62vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--surface-2);color:var(--ink-strong)}
.msg.assistant{align-self:flex-start;background:transparent;padding-left:0}
.msg.tool{align-self:flex-start;font-size:.8rem;color:var(--muted);padding:0}
.msg-ctx{align-self:flex-end;font-size:.74rem;color:var(--muted);max-width:88%;margin-bottom:-10px;text-align:right;overflow-wrap:anywhere}
.studywrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,410px);gap:20px;align-items:start}
.side-chat{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.side-chat .chat{max-height:calc(100vh - 420px);min-height:180px}
@media (max-width:980px){.studywrap{grid-template-columns:minmax(0,1fr)}.side-chat{position:static}.side-chat .chat{max-height:50vh}}
.composer{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface)}
.composer textarea{border:0;min-height:48px;max-height:220px;padding:6px 8px;background:transparent}
.composer textarea:focus-visible{outline:none}
.composer:focus-within{border-color:var(--muted)}
.slides{display:flex;flex-direction:column;gap:12px}
.slides img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.slides .ph{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;max-width:100%}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.crow .t{overflow-wrap:anywhere}
#modal{position:fixed;inset:0;z-index:50;background:rgba(20,20,19,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .box{background:var(--surface);border-radius:14px;padding:22px;width:min(560px,100%);max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink-strong);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
hr.sep{border:0;border-top:1px solid var(--line);width:100%;margin:0}
.exam{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:600px){.exam{grid-template-columns:minmax(0,1fr)}}
.count{display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;border-radius:12px;background:var(--accent-soft);color:var(--accent);flex:none}
.count b{font-family:var(--display);font-size:2.2rem;line-height:1;font-weight:600}
.count span{font-size:.75rem;font-weight:700}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.elist{display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow-y:auto;padding-right:4px}
.egroup{display:flex;flex-direction:column;gap:4px}
.erow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;color:var(--ink)}
.erow:hover{background:var(--surface-2)}
.erow > span:last-child{display:flex;flex-direction:column;overflow-wrap:anywhere}
.erow .ebox{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;color:var(--accent-ink)}
.erow[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.erow[aria-checked="true"] .ebox{background:var(--accent);border-color:var(--accent)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.86rem;color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink-strong);background:var(--accent-soft)}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <button class="brand" data-act="nav" data-arg="today"><span class="mark" aria-hidden="true"></span>Recall Lab</button>
  <nav class="main">
    <button data-nav="today" data-act="nav" data-arg="today">Today</button>
    <button data-nav="reviews" data-act="nav" data-arg="reviews">Reviews</button>
    <button data-nav="library" data-act="nav" data-arg="library">Library</button>
    <button data-nav="ask" data-act="nav" data-arg="ask">Ask AI</button>
  </nav>
  <div class="hdr-r"><span class="sync" id="sync">Loading…</span><button class="btn primary sm" data-act="nav" data-arg="add">Add lecture</button></div>
</div></header>
<main class="wrap" id="view"></main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
"use strict";
/* ---------- constants ---------- */
const DAY = 86400000;
const LEVELS = {1:"Remember",2:"Understand",3:"Apply",4:"Analyse & Evaluate"};
const OPEN_TYPES = ["why","case","compare"];
const MODES = [["mclq","MC → Written"],["mc","MC only"],["lq","Written only"],["mix","Mix"]];
const PDFJS = "/vendor/pdf.min.js";
const PDFJS_W = "/vendor/pdf.worker.min.js";
const LS = "recall-lab-studio-v3";

/* ---------- state ---------- */
function freshAdd(){ return {name:"", text:"", focus:"", fileName:"", file:null, pages:null, images:[], srcKind:"", status:"", busy:false, err:"", showPaste:false, courseId:"", newCourse:""}; }
const S = {
  decks: [], threads: [], profile: defProfile(), mode: "local", view: "today", deckId: null, secId: null, ltab: "path",
  session: null, feyn: null, quiz: null, modal: null, add: freshAdd(),
  chat: {input:"", busy:false, threadId:null, stream:"", err:"", ctl:null},
  askId: null, askUI: {q:"", by:"date", menu:null, rename:null, renameText:"", confirm:null}, tutorId: {}, rev: {f:"due", q:"", deck:""}, lib: {course:"all", q:"", sort:"recent"}, showSlides: false,
  split: (() => { try{ const v = localStorage.getItem("recall-lab-split"); if(v != null) return v === "1"; }catch(e){} return window.innerWidth >= 980; })(),
  secThread: {}, secTemp: {},
  focusDraft: {}, gen: {}, ai: "pending", aiTools: false, aiImages: false, aiBlocked: false, cardFilter: 0,
};
let db = null, uid = null, sample = null, assets = null;
const PAGES = {}, PDFDOC = {}, PIMG = {};

function defProfile(){ return {kind:"profile", streak:0, lastDay:null, history:{}, courses:[], mode:"mclq", lang:"yue", exams:[], models:{chat:"auto", teach:"auto", mark:"auto"}}; }
function langLine(what){
  if(S.profile.lang !== "yue") return "";
  return `\nLANGUAGE: Write ${what} in Hong Kong Cantonese (colloquial written Cantonese in Traditional Chinese, e.g. 係、唔、嘅、咁、啲), keeping every medical and scientific term, drug name, receptor, enzyme and unit in English. The student sits an English-language exam, so exam questions, cards, multiple-choice options and model answers stay in English.`;
}
function langSeg(id){ return `<div class="seg" role="group" aria-label="AI language" id="${id}">${[["en","English"],["yue","廣東話"]].map(([k, l]) => `<button aria-pressed="${S.profile.lang === k}" data-act="setLang" data-arg="${k}">${l}</button>`).join("")}</div>`; }
const MODELS = {
  auto:{label:"Auto (recommended)", short:"Auto"},
  haiku:{label:"Fast · low reasoning", short:"Fast", id:"fast", tier:"quick"},
  sonnet:{label:"Balanced · medium reasoning", short:"Balanced", id:"balanced", tier:"default"},
  opus:{label:"Thorough · high reasoning, slower", short:"Thorough", id:"thorough", tier:"complex"},
};
function modelKey(k){ return (S.profile.models && S.profile.models[k]) || "auto"; }
function modelOpts(k, defTier){ const m = MODELS[modelKey(k)] || MODELS.auto; if(!m.id) return defTier ? {modelTier:defTier} : {}; return {model:m.id, modelTier:m.tier}; }
function modelSelect(k, id){ return `<select id="${id}" data-change="setModel" data-key="${k}" style="width:auto">${Object.entries(MODELS).map(([v, m]) => `<option value="${v}" ${modelKey(k) === v ? "selected" : ""}>${m.label}</option>`).join("")}</select>`; }
function gid(p){ return (p||"") + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dayKey(t){ const d = new Date(t ?? Date.now()); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function startOfDay(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function endOfToday(){ return startOfDay(Date.now()) + DAY - 1; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pct(n,d){ return d ? Math.round(100*n/d) : 0; }
function plural(n,w){ return n + " " + w + (n===1 ? "" : "s"); }
function relDay(t){ if(t==null) return "later"; const d = Math.round((startOfDay(t)-startOfDay(Date.now()))/DAY); if(d===0) return "today"; if(d===1) return "tomorrow"; if(d===-1) return "yesterday"; return d < 0 ? (-d) + " days ago" : "in " + d + " days"; }
function fmtDate(t){ return t ? new Date(t).toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"}) : ""; }
function fmtSize(b){ return b > 1048576 ? (b/1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b/1024)) + " KB"; }
function fmtIv(days){ if(days < 1) return "10m"; if(days < 30) return Math.round(days)+"d"; if(days < 365) return Math.round(days/30)+"mo"; return (days/365).toFixed(1)+"y"; }
function deck(id){ return S.decks.find(d => d.id === id); }
function section(d,id){ return d?.sections.find(s => s.id === id); }
function thread(id){ return S.threads.find(t => t.id === id); }
function course(id){ return (S.profile.courses || []).find(c => c.id === id); }
function courseName(id){ return course(id)?.name || "Uncategorised"; }

/* ---------- persistence ---------- */
const W = {pending:new Map(), busy:new Set(), timers:new Map()};
function setSync(state){
  const el = document.getElementById("sync");
  el.textContent = {local:"Saved on this device", synced:"Saved on Mac", saving:"Saving…", saved:"Saved on Mac", error:"Couldn't save. Check your connection."}[state] || "";
  el.title = state === "local" ? "Saved in this browser" : "Saved in Recall Lab on this Mac";
  el.classList.toggle("err", state === "error");
}
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify({decks:S.decks, profile:S.profile, threads:S.threads.filter(t => t.messages.length)})); }catch(e){} }
function persist(id, data){
  lsSave();
  if(S.mode !== "db"){ lsSave(); return; }
  clearTimeout(W.timers.get(id));
  W.timers.set(id, setTimeout(() => { W.pending.set(id, data === null ? null : JSON.parse(JSON.stringify(data))); flush(id); }, 600));
}
async function flush(id){
  if(W.busy.has(id) || !W.pending.has(id)) return;
  const data = W.pending.get(id); W.pending.delete(id); W.busy.add(id); setSync("saving");
  try{
    const ref = db.collection("data/users/"+uid).doc(id);
    if(data === null) await ref.delete(); else await ref.set(data);
    setSync("saved");
  }catch(e){
    if(e && e.code === "unavailable"){ if(!W.pending.has(id)) W.pending.set(id, data); setTimeout(() => flush(id), 1500 + Math.random()*1500); }
    else setSync("error");
  }finally{ W.busy.delete(id); if(W.pending.has(id)) flush(id); }
}
function saveDeck(d){ persist(d.id, d); }
function saveProfile(){ persist("profile", S.profile); }
function saveThread(t){ persist(t.id, t); }

async function savePages(deckId, pages){
  PAGES[deckId] = pages;
  if(S.mode !== "db"){ try{ localStorage.setItem(LS+"-src-"+deckId, JSON.stringify(pages)); }catch(e){} return; }
  let part = 0, cur = {}, size = 0;
  const write = (obj, p) => db.collection("data/users/"+uid).doc("src_"+deckId+"_"+p).set({kind:"source", deckId, part:p, pages:obj});
  for(let i=0;i<pages.length;i++){
    const t = (pages[i] || "").slice(0, 150000);
    if(size + t.length > 150000 && size > 0){ await write(cur, part); part++; cur = {}; size = 0; }
    cur[String(i+1)] = t; size += t.length;
  }
  await write(cur, part);
}
async function getPages(deckId){
  if(PAGES[deckId]) return PAGES[deckId];
  if(S.mode === "db"){
    const snap = await db.collection("data/users/"+uid).where("deckId","==",deckId).get();
    const arr = [];
    snap.docs.forEach(doc => { const v = doc.data(); if(v && v.kind === "source") for(const k in v.pages) arr[Number(k)-1] = v.pages[k]; });
    return PAGES[deckId] = arr;
  }
  try{ return PAGES[deckId] = JSON.parse(localStorage.getItem(LS+"-src-"+deckId)) || []; }catch(e){ return []; }
}
async function deletePages(deckId){
  delete PAGES[deckId];
  if(S.mode !== "db"){ try{ localStorage.removeItem(LS+"-src-"+deckId); }catch(e){} return; }
  try{
    const snap = await db.collection("data/users/"+uid).where("deckId","==",deckId).get();
    for(const doc of snap.docs){ const v = doc.data(); if(v && v.kind === "source") await db.collection("data/users/"+uid).doc(doc.id).delete(); }
  }catch(e){}
}
function migrate(){
  S.profile = Object.assign(defProfile(), S.profile);
  S.profile.models = Object.assign({chat:"auto", teach:"auto", mark:"auto"}, S.profile.models || {});
  if(!S.profile.lang) S.profile.lang = "yue";
  if(!Array.isArray(S.profile.exams)) S.profile.exams = [];
  S.decks.forEach(d => {
    d.added = d.added || d.created;
    d.cards.forEach(c => { if(c.recalled == null) c.recalled = c.reps || 0; });
    if(d.chat && d.chat.length){ const t = {kind:"thread", id:gid("t"), title:"Tutor · " + d.name, deckId:d.id, secId:null, messages:d.chat, created:Date.now(), updated:Date.now()}; S.threads.push(t); saveThread(t); }
    if(d.chat){ delete d.chat; saveDeck(d); }
  });
  S.threads.sort((a,b) => b.updated - a.updated);
}

async function boot(){
  let local = null;
  try{ local = JSON.parse(localStorage.getItem(LS)); }catch(e){}
  if(local){ S.decks = local.decks || []; S.profile = local.profile || defProfile(); S.threads = local.threads || []; }
  migrate(); render(); setSync("local");
  if(!window.claude || !window.claude.use){ S.ai = "none"; render(); return; }
  claude.use("sample").then(async s => {
    sample = s; S.ai = s ? "ready" : "none";
    if(s){ try{ const l = await s.limits(); S.aiTools = !!l.tools; S.aiImages = !!l.images; }catch(e){} }
    render();
  });
  claude.use("assets").then(a => { assets = a; render(); });
  try{
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    const id = u ? await u.id() : null;
    if(d && id){
      db = d; uid = id;
      const snap = await db.collection("data/users/"+uid).where("kind","in",["deck","profile","thread"]).get();
      const decks = [], threads = []; let prof = null;
      snap.docs.forEach(doc => { const v = doc.data(); if(!v) return; const o = JSON.parse(JSON.stringify(v)); if(v.kind === "deck") decks.push(o); else if(v.kind === "thread") threads.push(o); else prof = o; });
      S.mode = "db";
      if(!decks.length && !prof && S.decks.length){
        S.decks.forEach(dk => saveDeck(dk)); saveProfile(); S.threads.forEach(t => t.messages.length && saveThread(t));
        for(const dk of S.decks){ try{ const p = JSON.parse(localStorage.getItem(LS+"-src-"+dk.id)); if(p) await savePages(dk.id, p); }catch(e){} }
      }else{
        S.decks = decks.sort((a,b) => a.created - b.created); S.threads = threads; S.profile = prof || defProfile();
        migrate();
      }
      setSync("synced");
    }
  }catch(e){ S.mode = "local"; setSync("local"); }
  render();
}

/* ---------- cards & scheduling ---------- */
function mkCard(raw, sec){
  let type = String(raw.type || "basic").toLowerCase();
  const bloom = Math.min(4, Math.max(1, parseInt(raw.bloom, 10) || 1));
  if(!["basic","cloze","why","case","compare"].includes(type)) type = bloom === 1 ? "basic" : bloom === 2 ? "why" : bloom === 3 ? "case" : "compare";
  const c = {id: gid("c"), sec, type, bloom, front: String(raw.front || "").trim(), back: String(raw.back || "").trim(),
    points: Array.isArray(raw.points) ? raw.points.map(String).filter(Boolean).slice(0,5) : [],
    ease: 2.5, interval: 0, reps: 0, recalled: 0, lapses: 0, due: null, blind: 0, created: Date.now()};
  const wrong = Array.isArray(raw.wrong) ? raw.wrong.map(String).filter(Boolean).slice(0,3) : [];
  if(raw.mcAnswer && wrong.length >= 2) c.mc = {a: String(raw.mcAnswer), wrong};
  return c;
}
function isOpen(c){ return c.bloom >= 2 || OPEN_TYPES.includes(c.type); }
function secure(c){ return c.reps >= 2 && c.interval >= 3 && (c.recalled || 0) >= 1; }
function nextInterval(c, g, conf){
  if(g === 1) return 0;
  let iv;
  if(g === 2) iv = c.reps === 0 ? 1 : Math.max(1, c.interval * 1.2);
  else if(g === 3) iv = c.reps === 0 ? 1 : c.reps === 1 ? 3 : c.interval * c.ease;
  else iv = c.reps === 0 ? 3 : c.reps === 1 ? 5 : c.interval * c.ease * 1.3;
  if(conf === "unsure" && g >= 3) iv = Math.max(1, iv * 0.8);
  return Math.round(iv * 10) / 10;
}
function schedule(c, g, conf, d){
  const now = Date.now();
  if(g === 1){
    if(conf === "sure"){ c.blind = (c.blind || 0) + 1; c.ease = Math.max(1.3, c.ease - 0.3); }
    else c.ease = Math.max(1.3, c.ease - 0.2);
    if(c.reps > 0) c.lapses++;
    c.reps = 0; c.interval = 0; c.due = now + 10*60000;
  }else{
    const iv = nextInterval(c, g, conf);
    if(g === 2) c.ease = Math.max(1.3, c.ease - 0.15);
    if(g === 4) c.ease += 0.15;
    if(g >= 3 && c.blind && iv >= 3) c.blind = 0;
    c.interval = iv; c.reps++; c.due = startOfDay(now + iv*DAY);
    const cap = d && examCap(d);
    if(cap && c.due > cap) c.due = cap;
  }
  c.last = now;
}
function bumpHistory(d){
  const p = S.profile, t = dayKey();
  p.history[t] = (p.history[t] || 0) + 1;
  if(p.lastDay !== t){ p.streak = p.lastDay === dayKey(Date.now() - DAY) ? p.streak + 1 : 1; p.lastDay = t; }
  const cutoff = dayKey(Date.now() - 90*DAY);
  for(const k of Object.keys(p.history)) if(k < cutoff) delete p.history[k];
  if(d) d.lastStudied = Date.now();
}
function streakNow(){ const p = S.profile; return (p.lastDay === dayKey() || p.lastDay === dayKey(Date.now()-DAY)) ? p.streak : 0; }

/* ---------- lecture model ---------- */
function activeSecs(d){ return d.sections.filter(s => s.priority !== "skip"); }
function liveCards(d){ const skip = new Set(d.sections.filter(s => s.priority === "skip").map(s => s.id)); return d.cards.filter(c => !skip.has(c.sec)); }
function dueCards(d){ const end = endOfToday(); return liveCards(d).filter(c => c.due != null && c.due <= end); }
function l1Ready(d, s){ const l1 = d.cards.filter(c => c.sec === s.id && c.bloom === 1); return !l1.length || l1.filter(c => c.reps >= 1).length / l1.length >= 0.6; }
function newL1(d, s){ return d.cards.filter(c => c.sec === s.id && c.bloom === 1 && c.due == null); }
function practiceNew(d){ return liveCards(d).filter(c => { const s = section(d, c.sec); return c.bloom >= 2 && c.due == null && s && s.learned && l1Ready(d, s); }); }
function secScore(d, s){
  const cs = d.cards.filter(c => c.sec === s.id);
  const has = !!s.lesson && s.learned;
  const l1 = cs.filter(c => c.bloom === 1), l2 = cs.filter(c => c.bloom === 2), l34 = cs.filter(c => c.bloom >= 3);
  const learn = s.learned ? 1 : 0;
  const rem = l1.length ? l1.filter(secure).length / l1.length : (has ? 1 : 0);
  const und = (l2.filter(secure).length + ((s.feyn || 0) >= 70 ? 1 : 0)) / (l2.length + 1);
  const app = l34.length ? l34.filter(secure).length / l34.length : (has ? 1 : 0);
  return {learn, rem, und, app, total: (learn + rem + und + app) / 4};
}
function progress(d){
  const secs = activeSecs(d);
  const acc = {learn:0, rem:0, und:0, app:0, total:0};
  if(!secs.length) return acc;
  secs.forEach(s => { const r = secScore(d, s); for(const k in acc) acc[k] += r[k]; });
  for(const k in acc) acc[k] = Math.round(100 * acc[k] / secs.length);
  return acc;
}
function nextStep(d){
  const due = dueCards(d).length;
  if(due) return {kind:"review", label:"Review " + plural(due, "due card"), sub:"Spaced recall comes first. These are the cards about to fade."};
  const secs = activeSecs(d);
  for(const s of secs) if(s.learned){ const n = newL1(d, s).length; if(n) return {kind:"lockin", sec:s.id, label:"Lock in “" + s.title + "”", sub: plural(n, "new recall card") + " from a section you've read"}; }
  const nx = secs.find(s => !s.learned);
  if(nx) return {kind:"learn", sec:nx.id, label:"Learn “" + nx.title + "”", sub:(nx.priority === "high" ? "High-yield. " : "") + "Read the key points and slides, then answer 2 quick checks."};
  const f = secs.find(s => s.learned && (s.feyn || 0) < 70 && l1Ready(d, s));
  if(f) return {kind:"feyn", sec:f.id, label:"Explain “" + f.title + "” in your own words", sub:"Feynman check. The AI finds the gaps in your explanation."};
  const p = practiceNew(d).length;
  if(p) return {kind:"practice", label:"Practise " + plural(p, "why / case / compare question"), sub:"Mixed across sections, so you learn to tell similar ideas apart."};
  const pr = progress(d);
  if(pr.total >= 100) return {kind:"done", label:"Exam-ready", sub:"Every section is secure. Keep up the short reviews, or take a mock quiz."};
  const pend = liveCards(d).filter(c => !secure(c) && c.due != null);
  const nd = pend.reduce((m,c) => Math.min(m, c.due), Infinity);
  return {kind:"wait", label:"Next session " + relDay(isFinite(nd) ? nd : null), sub: plural(pend.length, "card") + " need one more correct recall on a later day to count as secure."};
}

/* ---------- AI ---------- */
function aiOK(){ return S.ai === "ready" && !S.aiBlocked; }
function aiMsg(e){
  const c = e && e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)) S.aiBlocked = true;
  return ({
    not_granted:"AI is switched off.",
    sampling_disabled:"Codex isn't available. Check that the ChatGPT app is installed and signed in.",
    rate_limited:"You've hit a usage limit. Wait a little, then try again.",
    prompt_too_large:"That's too much material at once. Split it into one lecture at a time.",
    invalid_json:"The AI's reply came back in the wrong format. Try again.",
    refused:"Codex declined this request. Try rewording it or trimming the material.",
    session_expired:"Sign in to the ChatGPT app (Codex) again, then retry.",
    cancelled:"Stopped.",
    image_rejected:"One of the images couldn't be read. Try a JPEG or PNG under 20 MB.",
    empty_completion:"The AI returned nothing. Try again with less material.",
  })[c] || (e && e.message ? "Codex: " + e.message : "Couldn't reach Codex. Try again.");
}
function aiNote(){
  if(S.ai === "pending") return `<p class="small muted"><span class="spin"></span> Connecting to Codex…</p>`;
  if(!aiOK()) return `<p class="small muted">AI features need Codex: install the ChatGPT app, sign in, then restart <code>npm start</code>.</p>`;
  return "";
}
const CARD_SPEC = `   bloom 1 Remember: type "basic" (question → answer of 20 words or fewer) or "cloze" (a sentence with the key term replaced by "____"; back = the missing term). About half the cards.
   bloom 2 Understand: type "why", asking why or how a mechanism works.
   bloom 3 Apply: type "case", a 1-3 sentence clinical scenario asking to predict an effect, adverse effect, interaction or compensation.
   bloom 4 Analyse & Evaluate: type "compare", comparing or choosing between options with justification.
   For bloom 2-4 the back is a model answer of 70 words or fewer, and "points" lists 2-4 key points a marker would check. One idea per card; fronts 35 words or fewer.
   Every card also has a multiple-choice version: "mcAnswer" = the correct answer in 20 words or fewer, and "wrong" = 3 plausible but clearly incorrect options of similar length and style (commonly confused drugs, receptors, directions of change or mechanisms).`;

function outlinePrompt(text, focus, kind){
  return `You are planning a revision path for a university student (pharmacology / human physiology) who has forgotten this lecture and needs to learn it for an exam.
The material is a ${kind} split with [Page N] markers.

EXAM FOCUS FROM THE STUDENT (what the professor emphasised or said to skip; may be empty):
${focus || "(none given)"}

Split the material into 3-12 teachable sections, in the order they appear. Each section is one coherent topic over a contiguous page range.
Priority:
- "high": the professor emphasised it, or it is classic exam material (mechanisms, drug classes, key physiology, clinical relevance)
- "normal": supporting content
- "skip": the professor said it won't be examined, or it is title/admin/references/history pages with nothing examinable

Reply with only JSON: {"title":"short lecture name","sections":[{"title":"...","pages":[first,last],"priority":"high","why":"one short reason"}]}

MATERIAL:
${text}`;
}
function lessonPrompt(d, s, text){
  const n = s.priority === "high" ? 12 : 7;
  return `You are a professor teaching a university student who has forgotten this section and must learn it for an exam in pharmacology / human physiology.
LECTURE: ${d.name}
SECTION: ${s.title}${s.pages ? " (pages " + s.pages[0] + "-" + s.pages[1] + ")" : ""}, priority: ${s.priority}
EXAM FOCUS FROM THE STUDENT: ${d.focus || "(none)"}
${d.studio?.focusOnly ? "Only teach the listed key concepts. Omit unrelated material and excluded topics." : ""}

SOURCE TEXT FOR THIS SECTION:
${text || "(source unavailable: state this and do not invent facts)"}

Write:
1. "keyPoints": 4-8 key points a student must know, one sentence each, exam-focused, with specifics (receptor subtypes, ↑/↓, numbers, units). Start a point with "★ " if the exam focus emphasises it.
2. "explain": a plain-language explanation that links the key points as cause and effect, 120-200 words, no unexplained jargon.
3. "hook": one memory aid (mnemonic, analogy or contrast), one sentence.
4. "checks": 2 short questions testing understanding of the explanation, each with a one-sentence answer.
5. "cards": about ${n} spaced-repetition cards that together cover every key point, across Bloom levels:
${CARD_SPEC}
Use only the supplied source. Add [p. N] to every explanation paragraph, key point and answer, using the exact source page. Label any suspected source error for checking; never silently replace it with unsupported information.${langLine('"explain" and "hook" (keyPoints, checks and cards stay in English)')}

Reply with only JSON: {"keyPoints":["..."],"explain":"...","hook":"...","checks":[{"q":"...","a":"..."}],"cards":[{"type":"basic","bloom":1,"front":"...","back":"...","points":[],"mcAnswer":"...","wrong":["...","...","..."],"sourcePages":[1]}]}`;
}

/* ---------- material intake ---------- */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); }); }
async function pdfLib(){ if(!window.pdfjsLib) await loadScript(PDFJS); window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_W; return window.pdfjsLib; }
async function pdfPages(file){
  const lib = await pdfLib();
  const doc = await lib.getDocument({data: await file.arrayBuffer(), isEvalSupported:false}).promise;
  const pages = []; let total = 0;
  for(let i=1;i<=doc.numPages;i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    const t = tc.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("").replace(/[ \t]+/g," ").trim();
    pages.push(t); total += t.length;
    S.add.status = "Reading page " + i + " of " + doc.numPages + "…"; setStatus();
    if(total > 400000) break;
  }

}
function textPages(text){
  const paras = text.split(/\n\s*\n/); const pages = []; let cur = "";

  if(cur.trim()) pages.push(cur.trim());
  return pages;
}
function joinPages(pages, from, to, cap){

}

function pairs(d, cards){ return cards.map(c => ({d:d.id, c:c.id})); }

function cur(){ const s = S.session; const it = s && s.queue[s.idx]; if(!it) return null; const d = deck(it.d); const c = d && d.cards.find(x => x.id === it.c); return c ? {d, c, it} : null; }
function presentFor(c, it){
  const m = S.session.mode;
  if(it.force) return it.force;
  if(m === "lq" || !c.mc) return "lq";
  if(m === "mc") return "mc";

function resetCard(){
  const s = S.session; s.ctl && s.ctl.abort();
  Object.assign(s, {phase:"ask", conf:null, typed:"", ai:null, aiErr:"", explain:"", explaining:false, ctl:null, picked:null, opts:null, present:"lq"});
  skipMissing();

  s.present = presentFor(k.c, k.it);

async function ensureMC(){
  const s = S.session; if(!s || s.mode === "lq" || !aiOK()) return;
  const need = []; const seen = new Set();
  s.queue.forEach(it => { const d = deck(it.d), c = d && d.cards.find(x => x.id === it.c); if(c && !c.mc && !seen.has(c.id)){ seen.add(c.id); need.push({d, c}); } });
  if(!need.length) return;
  const batch = need.slice(0, 30);

  try{
    const r = await sample.json(`For each flashcard below, write a multiple-choice version for a university pharmacology / physiology student.
"a" = the correct answer in 20 words or fewer. "wrong" = 3 plausible but clearly incorrect options of similar length and style (commonly confused drugs, receptors, directions of change or mechanisms).

${batch.map(({c}) => "[" + c.id + "] Q: " + c.front + " | A: " + c.back).join("\n")}`, modelOpts("mark", "quick"));
    const touched = new Set();
    (Array.isArray(r) ? r : []).forEach(x => { const m = batch.find(b => b.c.id === String(x.id)); const w = Array.isArray(x.wrong) ? x.wrong.map(String).filter(Boolean).slice(0,3) : []; if(m && x.a && w.length >= 2){ m.c.mc = {a:String(x.a), wrong:w}; touched.add(m.d); } });

function mcGrade(g){

function newThread(deckId, secId){ return {kind:"thread", id:gid("t"), title:"New chat", deckId:deckId || null, secId:secId || null, messages:[], created:Date.now(), updated:Date.now()}; }

function chatTools(d){

    {name:"add_exam_focus", description:"Append a short note to the lecture's exam focus notes (what the professor said). Returns ok.",

     inputSchema:{type:"object", properties:{section_id:{type:"string"}, cards:{type:"array", items:{type:"object", properties:{type:{type:"string"}, bloom:{type:"integer"}, front:{type:"string"}, back:{type:"string"}, points:{type:"array", items:{type:"string"}}, mcAnswer:{type:"string"}, wrong:{type:"array", items:{type:"string"}}}, required:["front","back"]}}}, required:["section_id","cards"]},

async function sendChat(t, preset){

  const hist = t.messages.filter(m => m.role !== "tool").slice(S.profile.chatMode === "actions" ? -12 : -6);
  const lastCtx = hist.map((m, i) => m.ctxText ? i : -1).filter(i => i >= 0).slice(-1);
  const turns = [{role:"user", content:rules}, ...hist.map((m, i) => ({role:m.role, content: m.ctxText ? (lastCtx.includes(i) ? m.ctxText : "[About the card: " + m.ctx + "]") + "\n\nSTUDENT'S MESSAGE: " + m.content : m.content}))];
  const mk = chatTools(d);

    const opts = {cache:false, signal:ctl.signal, onText: ({text}) => { ch.stream = text; const el = document.getElementById("stream"); if(el){ el.textContent = text; scrollChat(); } }};
    if(mk && S.profile.chatMode === "actions") opts.tools = mk(t);
    const want = MODELS[modelKey("chat")];

function threadKind(t){ if(/^Practice · /.test(t.title)) return "Practice"; if(t.secId) return "Section"; if(t.deckId) return "Lecture"; return "General"; }
function threadSub(t){ const d = t.deckId && deck(t.deckId); const k = threadKind(t); const when = relDay(t.updated) === "today" ? new Date(t.updated).toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit"}) : fmtDate(t.updated).replace(/,? \d{4}$/, "");
  return [k === "Section" ? "Section" : "", d && k !== "Practice" ? d.name : "", when].filter(Boolean).join(" · "); }
function chatGroups(list, by){
  const map = new Map(), add = (k, t) => { if(!map.has(k)) map.set(k, []); map.get(k).push(t); };
  if(by === "lecture"){
    const order = S.decks.map(d => d.name);
    list.forEach(t => add(t.deckId && deck(t.deckId) ? deck(t.deckId).name : "General", t));
    return [...map.entries()].sort((a, b) => (a[0] === "General") - (b[0] === "General") || order.indexOf(a[0]) - order.indexOf(b[0]));
  }
  const today = startOfDay(Date.now());
  list.forEach(t => { const n = Math.round((today - startOfDay(t.updated)) / DAY);
    add(n <= 0 ? "Today" : n === 1 ? "Yesterday" : n <= 7 ? "Previous 7 days" : n <= 30 ? "Previous 30 days" : new Date(t.updated).toLocaleDateString(undefined, {month:"long", year:"numeric"}), t); });
  return [...map.entries()];
}
function threadRow(x, cur){
  const U = S.askUI;
  if(U.rename === x.id) return `<div class="trow on" style="padding:4px 6px"><input id="renamein" class="trename" type="text" data-bind="askUI.renameText" value="${esc(U.renameText)}" aria-label="Chat name"></div>`;
  if(U.confirm === x.id) return `<div class="tconfirm"><span>Delete “${esc(x.title)}”? This can't be undone.</span><div class="row" style="gap:6px"><button class="btn sm" style="color:var(--bad)" data-act="delThread" data-arg="${x.id}">Delete</button><button class="btn ghost sm" data-act="cancelDelThread">Cancel</button></div></div>`;
  return `<div class="trow ${x.id === cur ? "on" : ""}"><button class="topen" data-act="openThread" data-arg="${x.id}" aria-current="${x.id === cur}"><span class="tt">${esc(x.title)}</span><span class="ts">${esc(threadSub(x))}</span></button><button class="tdots" data-act="threadMenu" data-arg="${x.id}" aria-label="Chat options" aria-expanded="${U.menu === x.id}">⋯</button>
    ${U.menu === x.id ? `<div class="tmenu"><button data-act="renameThread" data-arg="${x.id}">Rename</button><button class="danger" data-act="askDelThread" data-arg="${x.id}">Delete</button></div>` : ""}</div>`;
}
V.ask = () => {
  const t = activeThread(); const U = S.askUI;

  const sugg = t.deckId ? ["What's most likely to be examined here?", "Explain the hardest section simply", "Quiz me on 3 high-yield points", "My professor said …"]
    : [upcomingExams().length ? "What should I do today to prepare for " + upcomingExams()[0].name + "?" : "How should I revise pharmacology for an exam in 3 weeks?", "Explain the difference between ACE inhibitors and ARBs", "Walk me through the cardiac action potential", "Make me a revision plan for my lectures"];
  return `<div class="split">
    <aside class="side" aria-label="Chats">
      <button class="btn primary" data-act="newChat" style="margin-bottom:6px">New chat</button>
      ${all.length ? `<input id="askq" class="tsearch" type="search" data-bind="askUI.q" data-live="1" value="${esc(U.q)}" placeholder="Search chats">
      <div class="tseg" role="group" aria-label="Organise chats">${[["date","By date"],["lecture","By lecture"]].map(([k, l]) => `<button aria-pressed="${U.by === k}" data-act="chatsBy" data-arg="${k}">${l}</button>`).join("")}</div>` : ""}
      <div class="tlist">
      ${all.length ? (list.length ? chatGroups(list, U.by).map(([g, ts]) => `<span class="lbl">${esc(g)} <span style="font-weight:400">${ts.length}</span></span>${ts.map(x => threadRow(x, t.id)).join("")}`).join("") : `<p class="small muted" style="padding:6px 10px">No chats match “${esc(U.q)}”.</p>`)
        : `<p class="small muted" style="padding:4px 10px">Your conversations are kept here, including chats from practice and lectures, so you can find them again.</p>`}
      </div>
      ${all.length ? `<p class="small muted" style="padding:8px 10px 0">${plural(all.length, "chat")}</p>` : ""}
    </aside>
    <div class="stack" style="min-width:0;gap:14px">
      <div class="row between" style="gap:10px">
        <h1 style="font-size:1.6rem;min-width:0;overflow-wrap:anywhere">${t.messages.length ? esc(t.title) : "Ask AI"}</h1>
        <div class="row" style="gap:6px"><button class="btn ghost sm" data-act="modelsMenu">AI settings</button>${t.messages.length ? `<button class="btn ghost sm" data-act="renameThread" data-arg="${t.id}">Rename</button><button class="btn ghost sm" data-act="askDelThread" data-arg="${t.id}">Delete</button>` : ""}</div>
      </div>
      <label class="f" style="max-width:420px">Use a lecture as context <span class="hint">The AI then knows its sections and your exam focus, and can mark sections High or Skip for you.</span>
        <select id="askctx" data-change="askCtx"><option value="">None, general question</option>${S.decks.map(d => `<option value="${d.id}" ${t.deckId === d.id ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></label>

};

function pathTab(d, pr){
  const ns = nextStep(d);
  const btn = {review:"Start review", lockin:"Start", learn:"Start learning", feyn:"Explain it", practice:"Start practice", done:"Take a mock quiz", wait:"Back to Today"}[ns.kind];
  const g = ns.sec && S.gen[ns.sec];
  return `<div class="panel next stack">
      <span class="eyebrow">Your next step</span>
      <h2>${esc(ns.label)}</h2>
      <p class="muted">${esc(ns.sub)}</p>
      <div class="row"><button class="btn primary lg" data-act="nextStep" ${(["learn","feyn","practice"].includes(ns.kind) && !aiOK() && !(ns.kind === "learn" && section(d, ns.sec)?.lesson)) ? "disabled" : ""}>${btn}</button>${ns.kind === "learn" ? `<span class="small muted" id="gen-${ns.sec}">${g && g.busy ? `<span class="spin"></span> Preparing this section…` : g && g.err ? esc(g.err) : ""}</span>` : ""}</div>
      ${aiNote()}
    </div>
    <div class="grid2">
      ${[["Learn", pr.learn, activeSecs(d).filter(s => s.learned).length + " of " + activeSecs(d).length + " sections read"],
         ["Remember", pr.rem, "Recall cards secure"],
         ["Understand", pr.und, "Why cards and Feynman explanations"],
         ["Apply & evaluate", pr.app, "Case and compare questions"]].map(([t, v, sub]) => `<div class="panel stack" style="gap:8px;padding:16px">
        <div class="row between"><b>${t}</b><span class="mono small">${v}%</span></div>
        <div class="bar"><i style="width:${v}%"></i></div>
        <span class="small muted">${sub}</span></div>`).join("")}
    </div>
    <div class="panel">

      <div>${d.sections.map(s => {
        const sc = secScore(d, s); const n = d.cards.filter(c => c.sec === s.id).length;
        const st = s.priority === "skip" ? "" : sc.total >= 1 ? "secure" : s.learned ? "learned" : "";
        return `<div class="sec ${s.priority === "skip" ? "skipped" : ""}">
          <span class="dot ${st}">${st ? "✓" : ""}</span>
          <div style="min-width:0" class="stack">
            <div class="row" style="gap:8px"><h3>${esc(s.title)}</h3>${prioChip(s.priority)}</div>
            <span class="small muted">${s.pages && d.srcKind === "pdf" ? "p. " + s.pages[0] + (s.pages[1] !== s.pages[0] ? "–" + s.pages[1] : "") + " · " : ""}${s.priority === "skip" ? esc(s.why || "Not examined") : (s.learned ? Math.round(sc.total*100) + "% secure" : "Not read yet") + (n ? " · " + plural(n, "card") : "") + (s.feyn ? " · explained " + s.feyn + "/100" : "")}</span>
            <div class="seg" role="group" aria-label="Exam priority">${["high","normal","skip"].map(p => `<button aria-pressed="${s.priority === p}" data-act="prio" data-arg="${s.id}|${p}">${p[0].toUpperCase() + p.slice(1)}</button>`).join("")}</div>
          </div>
          <div class="acts">${s.priority === "skip" ? "" : `
            <button class="btn sm ${!s.learned && ns.sec === s.id ? "primary" : ""}" data-act="learn" data-arg="${s.id}">${s.learned ? "Re-read" : "Learn"}</button>
            ${s.learned ? `<button class="btn sm" data-act="feyn" data-arg="${s.id}">Explain</button>` : ""}

function tutorTab(d){

function cardsTab(d){

function quizTab(d){

  if(q.qs && q.i < q.qs.length){ const it = q.qs[q.i];
    return `<div class="card stack">

        ${q.picked != null ? `<div class="fb"><b>${it.opts[q.picked].ok ? "Correct." : "Not quite."}</b><span>${esc(it.why)}</span></div><button class="btn primary" data-act="qnext" style="align-self:flex-start">${q.i + 1 < q.qs.length ? "Next question" : "See results"}</button>` : ""}

  }
  if(q.qs){ return `<div class="panel stack card">

      ${q.wrong.length ? `<p class="muted">The cards behind the ones you missed are due again now, so they'll come back in your next review.</p><ul class="kp">${q.wrong.map(w => `<li>${esc(w.q)}<br><span class="small muted">Answer: ${esc((w.opts.find(o => o.ok) || {}).t)}</span></li>`).join("")}</ul>` : `<p class="muted">Clean sweep.</p>`}
      <div class="row"><button class="btn primary" data-act="quizNew">New quiz</button></div></div>`; }
  return `<div class="panel stack card">
    <h2>Mock quiz</h2>
    <p class="muted">Exam-style multiple choice built from sections you've learned. It leans on your weakest cards and uses distractors you could plausibly confuse.</p>
    <label class="f" style="max-width:220px">Questions<select id="qcount" data-bind="quiz.count" data-num="1">${[5,8,12,20].map(n => `<option value="${n}" ${q.count === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>

V.section = () => {

  const canSlides = s.pages && (d.file || d.photos);

    <div class="panel stack"><h2>Key points</h2><ul class="kp">${L.keyPoints.map(k => k.startsWith("★") ? `<li class="star">${esc(k.replace(/^★\s*/, ""))}</li>` : `<li>${esc(k)}</li>`).join("")}</ul>${L.keyPoints.some(k => k.startsWith("★")) ? `<p class="small muted">★ = matches your exam focus</p>` : ""}</div>

V.study = () => {
  const s = S.session; skipMissing(); const k = cur();
  const modeBar = `<div class="seg" role="group" aria-label="Recall style">${MODES.map(([m,l]) => `<button aria-pressed="${s.mode === m}" data-act="mode" data-arg="${m}">${l}</button>`).join("")}</div>`;
  if(!k){
    const total = s.counts[1] + s.counts[2] + s.counts[3] + s.counts[4];
    const d = s.deckId && deck(s.deckId); const ns = d && nextStep(d);
    return `<div class="card stack"><div class="panel stack" style="padding:28px">
      <span class="eyebrow">${esc(s.label)}</span><h1>Session done</h1>
      <p class="muted">${s.mcRight + s.mcWrong ? "Multiple choice: " + s.mcRight + " right, " + s.mcWrong + " wrong. " : ""}${total ? "Recall: " + (s.counts[3] + s.counts[4]) + " recalled, " + s.counts[2] + " hard, " + s.counts[1] + " forgotten." : ""}${s.blindHits ? " " + plural(s.blindHits, "blind spot") + " found (you were sure but wrong). They'll come back sooner." : ""}</p>
      ${ns ? `<div class="panel next stack"><span class="eyebrow">Next step</span><h3>${esc(ns.label)}</h3><p class="small muted">${esc(ns.sub)}</p></div>` : ""}
      <div class="row">${d ? `<button class="btn primary" data-act="open" data-arg="${d.id}">Continue the path</button>` : ""}${s.returnTo === "reviews" ? `<button class="btn ${d ? "" : "primary"}" data-act="nav" data-arg="reviews">Back to Reviews</button>` : ""}<button class="btn" data-act="nav" data-arg="today">Today</button></div>
    </div></div>`;
  }

  const head = `<div class="row between"><span class="eyebrow">${esc(s.label)}</span><div class="row" style="gap:8px"><span class="mono small">${left} left</span><button class="btn ghost sm" data-act="exitStudy">Exit</button></div></div>

    <div class="row between" style="gap:8px">${modeBar}${s.preparing ? `<span class="small muted"><span class="spin"></span> Preparing choices…</span>` : s.prepErr ? `<span class="small muted">${esc(s.prepErr)}</span>` : ""}</div>`;
  const chips = `<div class="row" style="gap:6px">${lvChip(c.bloom)}${sec ? `<span class="chip">${esc(sec.title)}</span>` : ""}${c.due == null ? `<span class="chip accent">New</span>` : ""}${c.blind ? `<span class="chip bad">Blind spot</span>` : ""}<span class="chip">${s.present === "mc" ? "Multiple choice" : "Written recall"}</span></div>`;
  const after = `${c.points.length ? `<div class="stack" style="gap:4px"><span class="eyebrow">Key points</span><ul class="kp" style="gap:4px">${c.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : ""}
    ${s.explain || s.explaining ? `<div class="fb"><h4>Deeper explanation</h4><p id="explain" style="white-space:pre-wrap">${s.explain ? esc(s.explain) : `<span class="spin"></span> Thinking…`}</p></div>` : ""}
    <div class="row" style="gap:6px">${aiOK() && !s.explain && !s.explaining ? `<button class="btn ghost sm" data-act="explain">Explain why this is true</button>` : ""}${aiOK() ? `<button class="btn ghost sm" data-act="askCard">Ask AI about this card</button>` : ""}</div>`;
  if(s.present === "mc" && s.opts){
    const ok = s.picked != null && s.opts[s.picked].ok;
    const concept = s.mode === "mclq";
    const sgm = ok ? 3 : 1;
    const mivs = concept ? ["retry soon","write it next","write it next","write it next"] : [1,2,3,4].map(g => g === 1 ? "10m" : fmtIv(nextInterval(c, g, null)));
    return `<div class="card stack">${head}
      <div class="flash">${chips}<div class="q">${front}</div>
        <div class="stack" style="gap:8px">${s.opts.map((o, i) => `<button class="opt ${s.picked != null ? (o.ok ? "right" : i === s.picked ? "wrong" : "") : ""}" data-act="mcPick" data-arg="${i}" ${s.picked != null ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
        ${s.picked == null ? `<span class="small muted">Pick an answer, or press <span class="kbd">1</span>–<span class="kbd">${s.opts.length}</span>. Try to recall it before you read the options.</span>` : `
          <div class="fb"><b>${ok ? "Correct." : "Not quite."}</b><span>${concept ? (ok ? "Concept cleared. Rate how well you knew it. You'll write it from memory in a few cards." : "Read the answer below, then rate it. You'll see it again shortly.") : "How well did you know it? Be honest: a lucky guess is Hard or Again."}</span></div>
          <div class="a">${esc(c.back)}</div>
          ${after}
          <div class="grades">${[["Again",1],["Hard",2],["Good",3],["Easy",4]].map(([l, g]) => `<button class="${sgm === g ? "sugg" : ""}" data-act="mcGrade" data-arg="${g}">${l}<small>${mivs[g-1]}</small></button>`).join("")}</div>
          <span class="small muted"><span class="kbd">1</span>–<span class="kbd">4</span> to rate · <span class="kbd">Enter</span> takes the suggested one</span>`}
      </div></div>`;
  }
  const sg = s.phase === "answer" ? suggested() : 0;
  const ivs = [1,2,3,4].map(g => g === 1 ? "10m" : fmtIv(nextInterval(c, g, s.conf)));
  return `<div class="card stack">${head}
    <div class="flash">${chips}<div class="q">${front}</div>
      ${s.phase === "ask" ? `
        <textarea id="typed" data-bind="session.typed" placeholder="${isOpen(c) ? "Write your answer. Producing it from memory is what makes it stick." : "Type the answer, or just say it in your head"}">${esc(s.typed)}</textarea>
        <div class="stack" style="gap:6px"><span class="small muted">How sure are you?</span><div class="conf">${[["sure","Sure"],["unsure","Unsure"],["none","No idea"]].map(([k2, l]) => `<button class="btn" aria-pressed="${s.conf === k2}" data-act="conf" data-arg="${k2}">${l}</button>`).join("")}</div></div>
        <div class="row"><button class="btn primary" data-act="check" ${aiOK() ? "" : "disabled"}>Check with AI</button><button class="btn" data-act="reveal">Reveal and mark myself</button></div>
        <span class="small muted"><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> to check · <span class="kbd">Space</span> to reveal when not typing</span>
      ` : `
        <div class="a">${esc(c.back)}</div>
        ${s.typed ? `<div class="stack" style="gap:4px"><span class="eyebrow">Your answer</span><p class="small" style="white-space:pre-wrap">${esc(s.typed)}</p></div>` : ""}
        ${s.ai === "loading" ? `<div class="fb"><span><span class="spin"></span> Marking your answer…</span></div>` : s.ai ? `<div class="fb">
          <div class="row between"><b>${s.ai.score}/100</b><span class="small muted">Suggested: ${["","Again","Hard","Good","Easy"][sg]}</span></div>
          ${s.ai.feedback ? `<span>${esc(s.ai.feedback)}</span>` : ""}
          ${s.ai.got.length ? `<h4>You covered</h4><ul>${s.ai.got.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${s.ai.missed.length ? `<h4>Missing</h4><ul>${s.ai.missed.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
          ${s.ai.errors.length ? `<h4 style="color:var(--bad)">Wrong</h4><ul>${s.ai.errors.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        </div>` : s.aiErr ? `<p class="small" style="color:var(--bad)">${esc(s.aiErr)}</p>` : ""}
        ${after}
        <div class="grades">${[["Again",1],["Hard",2],["Good",3],["Easy",4]].map(([l, g]) => `<button class="${sg === g ? "sugg" : ""}" data-act="grade" data-arg="${g}">${l}<small>${ivs[g-1]}</small></button>`).join("")}</div>
        <span class="small muted"><span class="kbd">1</span>–<span class="kbd">4</span> to grade${s.conf === "sure" ? " · you said you were sure. If you got it wrong, pick Again: it becomes a blind spot." : ""}</span>
      `}
    </div>
  </div>`;
};

/* ---------- exams & daily prep plan ---------- */
function examDay(ex){ return new Date(ex.date + "T00:00:00").getTime(); }
function daysTo(ex){ return Math.round((examDay(ex) - startOfDay(Date.now())) / DAY); }
function upcomingExams(){ return (S.profile.exams || []).filter(ex => daysTo(ex) >= 0).sort((a,b) => examDay(a) - examDay(b)); }
function examCap(d){
  const ex = upcomingExams().find(x => x.deckIds.includes(d.id) && daysTo(x) >= 2);
  return ex ? startOfDay(examDay(ex) - DAY) : null;
}
function examInfo(ex){
  const decks = ex.deckIds.map(deck).filter(Boolean);
  const left = daysTo(ex);
  const ready = decks.length ? Math.round(decks.reduce((n, d) => n + progress(d).total, 0) / decks.length) : 0;
  const unlearned = decks.flatMap(d => activeSecs(d).filter(s => !s.learned).map(s => ({d, s})));
  const due = decks.reduce((n, d) => n + dueCards(d).length, 0);
  const lock = decks.flatMap(d => activeSecs(d).filter(s => s.learned && newL1(d, s).length).map(s => ({d, s})));
  const feyn = decks.flatMap(d => activeSecs(d).filter(s => s.learned && (s.feyn || 0) < 70 && l1Ready(d, s)).map(s => ({d, s})));
  const prac = decks.reduce((n, d) => n + practiceNew(d).length, 0);
  const blind = decks.reduce((n, d) => n + liveCards(d).filter(c => c.blind > 0).length, 0);
  const learnDays = Math.max(1, left - 3);
  const perDay = unlearned.length ? Math.ceil(unlearned.length / learnDays) : 0;
  let status = ["good","On track"];
  if(!decks.length) status = ["","No lectures linked"];
  else if(ready >= 100) status = ["good","Exam-ready"];
  else if(left <= 3 && unlearned.length) status = ["bad", plural(unlearned.length, "section") + " still unread"];
  else if(perDay > 4) status = ["bad","Behind: " + perDay + " sections a day needed"];
  else if(perDay > 2) status = ["warn","Tight: " + perDay + " sections a day"];
  const tasks = [];
  if(left === 0){ tasks.push({t:"Exam today. Keep it light: one pass of your blind spots, then rest.", sub:"No new material today. Sleep and a calm head are worth more than one more section.", act:blind ? "exBlind" : null, btn:"Drill blind spots"}); return {decks, left, ready, unlearned, due, perDay, status, tasks}; }
  if(due) tasks.push({t:"Review " + plural(due, "due card"), sub:"Always first: these are about to fade.", act:"exReview", btn:"Start"});
  lock.slice(0, 2).forEach(({d, s}) => tasks.push({t:"Lock in “" + s.title + "”", sub:d.name + " · " + plural(newL1(d, s).length, "new card"), act:"exLock", arg:d.id + "|" + s.id, btn:"Start"}));
  if(unlearned.length && left > 0){ const today = unlearned.slice(0, Math.max(1, perDay)); today.forEach(({d, s}, i) => tasks.push({t:"Learn “" + s.title + "”", sub:d.name + (s.priority === "high" ? " · high-yield" : "") + (i === 0 && perDay > 1 ? " · " + perDay + " sections a day to finish 3 days before the exam" : ""), act:"exLearn", arg:d.id + "|" + s.id, btn:"Learn"})); }
  feyn.slice(0, left <= 7 ? 2 : 1).forEach(({d, s}) => tasks.push({t:"Explain “" + s.title + "” in your own words", sub:"Feynman check · " + d.name, act:"exFeyn", arg:d.id + "|" + s.id, btn:"Explain"}));
  if(prac) tasks.push({t:"Practise " + plural(Math.min(prac, 15), "why / case / compare question"), sub:"Mixed across this exam's lectures", act:"exPractise", btn:"Start"});
  if(left <= 7){
    if(blind) tasks.push({t:"Drill " + plural(blind, "blind spot"), sub:"Things you were sure about but got wrong. Classic exam traps.", act:"exBlind", btn:"Drill"});
    const weakest = decks.slice().sort((a,b) => progress(a).total - progress(b).total)[0];
    if(weakest && left <= 3) tasks.push({t:"Mock quiz: " + weakest.name, sub:"Your least-revised lecture for this exam", act:"exQuiz", arg:weakest.id, btn:"Quiz"});
  }
  return {decks, left, ready, unlearned, due, perDay, status, tasks};
}
function examOf(a){ const id = String(a).split("#")[1] || a; return S.profile.exams.find(x => x.id === id); }
function examsText(){
  const ups = upcomingExams();
  if(!ups.length) return "(no exams entered yet)";
  return ups.map(ex => { const i = examInfo(ex);
    return `- ${ex.name} on ${ex.date}${ex.time ? " " + ex.time : ""} (${i.left === 0 ? "TODAY" : "in " + i.left + " days"}), readiness ${i.ready}%, status: ${i.status[1]}. Lectures: ${i.decks.map(d => d.name + " " + progress(d).total + "%").join(", ") || "none linked"}. Unread sections: ${i.unlearned.length}. Today's plan in the app: ${i.tasks.map(t => t.t).join("; ") || "nothing"}`; }).join("\n");
}
function examPanel(){
  const ups = upcomingExams();
  if(!ups.length) return `<div class="panel stack" style="gap:10px"><div class="row between"><h2>Exams</h2><button class="btn primary sm" data-act="addExam">Add exam</button></div><p class="muted small">Enter your exam date and tick the PDFs it covers. You'll get a countdown and a plan for each day, so every PDF is secure before the exam. The AI will know your dates too.</p></div>`;
  return `<div class="stack" style="gap:12px"><div class="row between"><h2>Exams</h2><button class="btn sm" data-act="addExam">Add exam</button></div>
    ${ups.map(ex => { const i = examInfo(ex); return `<div class="panel exam">
      <div class="count"><b>${i.left}</b><span>${i.left === 0 ? "TODAY" : i.left === 1 ? "DAY LEFT" : "DAYS LEFT"}</span></div>

/* ---------- reviews browser (Anki-style) ---------- */
const RFILTERS = [["due","Due today"],["overdue","Overdue"],["tomorrow","Tomorrow"],["week","Next 7 days"],["new","New"],["blind","Blind spots"],["lapsed","Forgotten before"],["all","All cards"]];
function reviewRows(){
  const R = S.rev, end = endOfToday(), sod = startOfDay(Date.now()), q = R.q.trim().toLowerCase();
  const test = {
    due: c => c.due != null && c.due <= end, overdue: c => c.due != null && c.due < sod,
    tomorrow: c => c.due != null && c.due > end && c.due <= end + DAY, week: c => c.due != null && c.due <= end + 6*DAY,
    new: c => c.due == null, blind: c => c.blind > 0, lapsed: c => c.lapses > 0, all: () => true}[R.f];
  const rows = [];
  S.decks.forEach(d => { if(R.deck && d.id !== R.deck) return; (R.f === "all" ? d.cards : liveCards(d)).forEach(c => {
    if(!test(c)) return;
    if(q && !(c.front + " " + c.back).toLowerCase().includes(q)) return;
    rows.push({d, c});
  }); });
  rows.sort((a, b) => (a.c.due ?? Infinity) - (b.c.due ?? Infinity));
  return rows;
}
function dueLabel(c){
  if(c.due == null) return `<span class="chip">New</span>`;
  const sod = startOfDay(Date.now()), end = endOfToday();
  if(c.due < sod){ const n = Math.round((sod - startOfDay(c.due)) / DAY); return `<span class="chip bad">Overdue ${n}d</span>`; }
  if(c.due <= end) return `<span class="chip warn">Today</span>`;
  return `<span class="chip">${relDay(c.due)}</span>`;
}
V.reviews = () => {

    <div class="panel" style="padding-block:6px">
      ${shown.length ? shown.map(({d, c}) => { const s = section(d, c.sec); const head = d.id !== lastDeck && !R.deck ? `<div class="eyebrow" style="padding:14px 0 2px">${esc(d.name)}</div>` : ""; lastDeck = d.id;

        : `<p class="muted" style="padding:16px 0">${R.f === "due" ? "Nothing due today. Nice." : "No cards here."}</p>`}

document.addEventListener("click", e => {
  const U = S.askUI;
  if(U.rename && !e.target.closest("#renamein")){ A.renameSave(); if(!e.target.closest("[data-act]")) return; }
  if(U.menu && !e.target.closest(".tmenu,.tdots")){ U.menu = null; if(!e.target.closest("[data-act]")){ render(); return; } }
  const t = e.target.closest("[data-act]"); if(!t || t.disabled) return;
  if(t.tagName === "A" || t.tagName === "LABEL") return;
  e.preventDefault();
  const fn = A[t.dataset.act]; if(fn) fn(t.dataset.arg);
});
document.getElementById("modal").addEventListener("click", e => { if(e.target.id === "modal"){ S.modal = null; renderModal(); } });
function setPath(path, v){ const ks = path.split("."); let o = S; for(let i=0;i<ks.length-1;i++){ o[ks[i]] = o[ks[i]] ?? {}; o = o[ks[i]]; } o[ks[ks.length-1]] = v; }
function bindEv(e){ const el = e.target, b = el.dataset && el.dataset.bind; if(!b) return; setPath(b, el.dataset.num ? Number(el.value) : el.value); if(el.dataset.live) render(); }
document.addEventListener("input", e => { if(e.target.tagName !== "SELECT") bindEv(e); });
document.addEventListener("change", e => {
  if(e.target.id === "file") return onFile(e.target);
  if(e.target.dataset && e.target.dataset.change){ const fn = A[e.target.dataset.change]; if(fn) fn(e.target.value, e.target.dataset.key); return; }
  if(e.target.tagName === "SELECT") bindEv(e);
});
document.addEventListener("keydown", e => {
  if(e.target.id === "renamein"){ if(e.key === "Enter"){ e.preventDefault(); A.renameSave(); } else if(e.key === "Escape"){ e.preventDefault(); S.askUI.rename = null; render(); } return; }
  if(e.key === "Escape" && (S.askUI.menu || S.askUI.confirm)){ S.askUI.menu = null; S.askUI.confirm = null; render(); return; }
  if(e.target.id === "chatin" && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); A.sendChat(); return; }
  if(e.key === "Escape" && S.modal){ S.modal = null; renderModal(); return; }
  if(S.view !== "study" || !S.session || S.modal) return;
  const s = S.session, k = cur(); if(!k) return;
  if(e.target.matches("textarea,input,select")){ if(e.key === "Enter" && (e.metaKey || e.ctrlKey) && s.phase === "ask" && s.present === "lq"){ e.preventDefault(); aiOK() && s.typed.trim() ? checkAnswer() : reveal(); } return; }
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(s.present === "mc" && s.opts){
    if(s.picked == null && /^[1-9]$/.test(e.key) && Number(e.key) <= s.opts.length){ e.preventDefault(); mcPick(Number(e.key) - 1); }
    else if(s.picked != null && /^[1-4]$/.test(e.key)){ e.preventDefault(); mcGrade(Number(e.key)); }
    else if(s.picked != null && e.key === "Enter"){ e.preventDefault(); mcGrade(s.opts[s.picked].ok ? 3 : 1); }
    return;
  }
  if(s.phase === "ask" && e.key === " "){ e.preventDefault(); reveal(); }
  else if(s.phase === "answer" && /^[1-4]$/.test(e.key)){ e.preventDefault(); grade(Number(e.key)); }
});
